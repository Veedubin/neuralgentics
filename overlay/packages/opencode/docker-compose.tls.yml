# docker-compose.tls.yml — memini-ai PostgreSQL stack with TLS enabled
#
# This is the TLS variant generated by `neuralgentics --db-start` (default).
# The plaintext variant (docker-compose.yml) is used when `--db-no-tls` is passed.
#
# TLS is configured via:
#   - ssl=on (PostgreSQL ssl parameter)
#   - ssl_cert_file=/certs/server.crt
#   - ssl_key_file=/certs/server.key
#   - ssl_ca_file=/certs/ca.crt
#
# The certs are generated by `neuralgentics --db-start` on first boot and
# stored in ~/.memini-ai/certs/{ca.crt,server.crt,server.key}.
# The DSN uses sslmode=verify-full + sslrootcert=<path to ca.crt>.
#
# Compatible with both `docker compose` (v2.38+) and `podman-compose` (v1.x).
# Multi-instance: same ${MEMINI_STACK_NAME:-memini} parameterisation as the
# plaintext compose file.

services:
  # ── PostgreSQL 18 + pgvector + TimescaleDB with TLS ────────────────────────
  db-server:
    image: ghcr.io/veedubin/neuralgentics-postgres:${NEURALGENTICS_VERSION:-latest}
    container_name: ${MEMINI_STACK_NAME:-memini}-db
    ports:
      - "${MEMINI_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${MEMINI_DB_USER:-memini}
      POSTGRES_PASSWORD: ${MEMINI_DB_PASSWORD:-memini}
      POSTGRES_DB: ${MEMINI_DB_NAME:-memini}
      # ── TLS configuration ──────────────────────────────────────────────────
      # Postgres reads these from postgresql.conf or via command-line flags.
      # The entrypoint script passes POSTGRES_* env vars, but SSL settings
      # need to go into the config. We use POSTGRES_INITDB_ARGS for initdb
      # and a custom postgresql.conf snippet via a mounted config file.
      # The simplest approach: mount certs and set ssl params via command.
    volumes:
      - memini-db:/var/lib/postgresql
      # Mount the TLS certs directory read-only into the container.
      - ${MEMINI_CERTS_DIR:-/certs}:/certs:ro
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/certs/server.crt"
      - "-c"
      - "ssl_key_file=/certs/server.key"
      - "-c"
      - "ssl_ca_file=/certs/ca.crt"
    networks:
      - memini-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  memini-db:
    name: ${MEMINI_STACK_NAME:-memini}-db

networks:
  memini-net:
    name: ${MEMINI_STACK_NAME:-memini}-net
    driver: bridge